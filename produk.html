<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk - Warung GENZ</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/produk.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#16a34a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-store"></i>
            <span>Warung GENZ</span>
        </div>
        <nav>
            <a href="dashboard.html" class="menu">
                <i class="fa-solid fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
            <a href="transaksi.html" class="menu">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Transaksi</span>
            </a>
            <a href="produk.html" class="menu active">
                <i class="fa-solid fa-box"></i>
                <span>Produk</span>
            </a>
            <a href="stok.html" class="menu">
                <i class="fa-solid fa-warehouse"></i>
                <span>Stok</span>
            </a>
            <a href="laporan.html" class="menu">
                <i class="fa-solid fa-file-invoice"></i>
                <span>Laporan</span>
            </a>
        </nav>
        <div class="sidebar-bottom">
            <a href="#" class="menu">
                <i class="fa-solid fa-gear"></i>
                <span>Pengaturan</span>
            </a>
            <a href="#" class="menu">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Keluar</span>
            </a>
        </div>
    </aside>

    <!-- KONTEN UTAMA -->
    <main class="main-content">
        <!-- HEADER -->
        <header class="header">
            <div class="header-left">
                <button id="menuButton" class="menu-button" type="button" onclick="toggleSidebar()">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h2 id="page-title">Produk</h2>
            </div>
            <div class="user-profile">
                <div class="user-icon">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <strong>Pemilik Warung</strong>
                    <small>Admin</small>
                </div>
            </div>
        </header>

        <!-- PRODUK SECTION -->
        <section id="produk" class="page active-page">
            <div class="page-header">
                <div>
                    <h1>Produk</h1>
                    <p>Kelola data produk warung</p>
                </div>

                <div class="product-actions">
                    <button class="primary-button" onclick="openProductModal()">
                        <i class="fa-solid fa-plus"></i>
                        Tambah Produk
                    </button>
                    <button class="primary-button" onclick="exportData()">
                        <i class="fa-solid fa-download"></i>
                        Export Data
                    </button>
                    <button class="primary-button" onclick="document.getElementById('importFile').click()">
                        <i class="fa-solid fa-upload"></i>
                        Import Data
                    </button>
                    <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
                </div>
            </div>

            <!-- SEARCH PRODUK -->
            <div class="product-toolbar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchProduct" placeholder="Cari nama produk..." onkeyup="displayProducts()">
                </div>
            </div>

            <!-- TABEL PRODUK -->
            <div class="product-table-container">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama Produk</th>
                            <th>Kategori</th>
                            <th>Harga Beli</th>
                            <th>Harga Jual</th>
                            <th>Stok</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="productTable">
                        <!-- Data produk akan muncul di sini -->
                    </tbody>
                </table>

                <!-- Jika belum ada produk -->
                <div id="emptyProduct" class="empty-state">
                    <i class="fa-solid fa-box-open"></i>
                    <h3>Belum Ada Produk</h3>
                    <p>Silakan tambahkan produk terlebih dahulu.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- MODAL TAMBAH PRODUK -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Tambah Produk</h2>
                <button onclick="closeProductModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="productForm">
                <input type="hidden" id="editProductIndex">

                <div class="form-group">
                    <label>Nama Produk</label>
                    <input type="text" id="productName" placeholder="Contoh: Indomie Goreng" required>
                </div>

                <div class="form-group">
                    <label>Barcode Produk</label>
                    <input type="text" id="productBarcode" placeholder="Masukkan nomor barcode">
                </div>

                <div class="form-group">
                    <label>Kategori</label>
                    <select id="productCategory" required>
                        <option value="">Pilih Kategori</option>
                        <option value="Sembako">Sembako</option>
                        <option value="Minuman">Minuman</option>
                        <option value="Makanan">Makanan</option>
                        <option value="Rokok">Rokok</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Harga Beli</label>
                        <input type="number" id="buyPrice" placeholder="0" required>
                    </div>

                    <div class="form-group">
                        <label>Harga Jual</label>
                        <input type="number" id="sellPrice" placeholder="0" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Stok</label>
                    <input type="number" id="productStock" placeholder="0" required>
                </div>

                <div class="modal-actions">
                    <button type="button" class="cancel-button" onclick="closeProductModal()">Batal</button>
                    <button type="submit" class="primary-button">Simpan Produk</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function() {
                navigator.serviceWorker.register("./service-worker.js");
            });
        }
    </script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="../js/produk.js"></script>
</body>
</html>
